name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          STAGING="staging-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "${STAGING}" dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -trimpath -ldflags="-s -w" -o "${STAGING}/rtt.exe" ./cmd/app/main.go
            (cd "${STAGING}" && zip "../dist/rtt-windows-${{ matrix.goarch }}-${TAG}.zip" rtt.exe)
          else
            go build -trimpath -ldflags="-s -w" -o "${STAGING}/rtt" ./cmd/app/main.go
            chmod +x "${STAGING}/rtt"
            tar -czf "dist/rtt-linux-${{ matrix.goarch }}-${TAG}.tar.gz" -C "${STAGING}" rtt
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rtt-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
